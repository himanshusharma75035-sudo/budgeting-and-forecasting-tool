version: 2
updates:
  # Backend Python dependencies (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    groups:
      backend-deps:
        patterns: ["*"]

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    groups:
      frontend-deps:
        patterns: ["*"]
    ignore:
      # typescript-eslint's peer range caps TypeScript at <6.1, so a TS major (7+) breaks linting.
      # Hold TS major bumps until typescript-eslint supports them, then remove this to upgrade.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # jsdom 30+ requires Node >=22, but CI runs on Node 20. Hold jsdom majors until we move to Node 22+.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions up to date (patch action CVEs), batched into one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    groups:
      github-actions:
        patterns: ["*"]
